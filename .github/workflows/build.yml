name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --quiet -r requirements.txt pillow
      - name: Compile every module
        run: python -m compileall -q printbridge tests build
      - name: Tests
        run: python -m unittest discover -s tests -v

  exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --quiet pyinstaller zeroconf pypdfium2
      - name: Icon
        run: python build/make_icon.py
      - name: Build
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/work build/printbridge.spec
      - name: Check it is really one file
        shell: pwsh
        run: |
          $exe = Get-Item "dist/Print Bridge.exe"
          "{0:N1} MB" -f ($exe.Length / 1MB)
          if ($exe.Length -lt 5MB) { throw "suspiciously small - the PDF engine is probably missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: print-bridge-exe
          path: dist/Print Bridge.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Print Bridge.exe
